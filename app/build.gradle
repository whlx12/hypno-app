plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hypno.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.hypno.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file("../keystore/hypno.jks")
            storePassword "hypno2024"
            keyAlias "hypno"
            keyPassword "hypno2024"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*', '**/*.kotlin_metadata']
        }
    }
}
